<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workout Log</title>
<meta name="theme-color" content="#f4c400">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column. Day strip on top, exercise list, bottom tab bar, bottom sheet for exercise detail. */
:root{
  --bg:#eceff0; --surface:#ffffff; --ink:#14181b; --muted:#5d666c; --line:#d5dade;
  --accent:#f4c400; --on-accent:#14181b; --ok:#1f7a45; --ok-bg:#dcf1e4; --shade:rgba(10,14,16,.5);
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1a1f23; --ink:#eef1f2; --muted:#97a1a7; --line:#2b3237;
  --accent:#f4c400; --on-accent:#14181b; --ok:#5fcf8c; --ok-bg:#17301f; --shade:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1a1f23; --ink:#eef1f2; --muted:#97a1a7; --line:#2b3237;
  --accent:#f4c400; --on-accent:#14181b; --ok:#5fcf8c; --ok-bg:#17301f; --shade:rgba(0,0,0,.65); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-inline:16px}
*{box-sizing:border-box}
#app{max-width:520px;margin:0 auto;padding-block:16px 96px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:2rem;line-height:1}
.top .sub{color:var(--muted);font-size:.9rem}
.who{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;min-height:36px;font-weight:600}
.who small{color:var(--muted);font-weight:500}
.prow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px}
.prow .nm{flex:1;text-align:left;background:none;border:0;padding:10px 0;min-height:44px;font-weight:600;font-size:1.05rem}
.prow[aria-current="true"]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-block:14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;text-align:center;min-width:0}
.day b{display:block;font-family:var(--display);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day span{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] b{color:var(--on-accent)}
.day i{display:block;height:4px;margin:4px 10px 0;border-radius:2px;background:transparent}
.day i.has{background:var(--ok)}
.day[aria-pressed="true"] i.has{background:var(--on-accent)}
.sec{margin-block:22px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{font-size:1.3rem;text-transform:uppercase;letter-spacing:.06em}
.sec small{color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:64px}
.row .txt{flex:1;min-width:0}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .pl{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.badge{font-family:var(--display);font-weight:700;font-size:1.1rem;min-width:52px;text-align:center;padding:4px 8px;border-radius:6px;border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.done{background:var(--ok-bg);border-color:transparent}
.row.done .badge{background:var(--ok);color:var(--surface);border-color:transparent}
.row.dim{opacity:.6}
.chip{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.row.skipped{background:transparent;border-style:dashed;opacity:.6}
.lt{margin-right:auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;min-height:36px;font-weight:600;font-size:.85rem}
.lt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rowwrap{display:flex;flex-direction:column;gap:4px;position:relative}
.rmbtn{position:absolute;bottom:8px;left:56%;background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:600;min-height:32px;padding:0 6px;font-size:.85rem}
.rmask{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:10px}
.empty b{color:var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.nav button{border:0;border-radius:8px;padding:12px 6px;line-height:1.1;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase;background:transparent;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-block:14px}
.tools input[type=search],.field input,.field select,.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;min-width:0}
.tools input[type=search]{flex:1 1 180px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.xrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px}
.xrow .nm{flex:1;min-width:0;background:none;border:0;text-align:left;padding:6px 0;font-weight:600;overflow-wrap:anywhere}
.xrow .sel{width:9.5rem;max-width:45%}
.xrow .nm .xs{display:block;font-weight:400;font-size:calc(1em - 1pt);color:var(--muted);margin-top:1px}
.xrow .tg{margin:0 0 4px;gap:5px}
.xrow .tg button{padding:4px 11px;min-height:38px}
.xrow .tg button.md{margin-left:auto}.xrow .tg button.md~button.md{margin-left:0}
.xd-daily{background:#f6c915!important;color:#1b1b1b!important}
.xd-mwf{background:#f28a1c!important;color:#1b1b1b!important}
.xd-tt{background:#43b05c!important;color:#10200f!important}
.xd-twice{background:#f48fb8!important;color:#2a0f1b!important}
.xd-once{background:#2f6fd6!important;color:#fff!important}
.xdiv{background:var(--ink);color:var(--bg);border-radius:8px;padding:9px 14px;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;margin:6px 0 2px}
.onoff{flex:none;min-width:68px;min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:.9rem;margin-left:6px}
.onoff[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.onoff[disabled]{opacity:.55}
.xrow.off{background:transparent;border-style:dashed;opacity:.6}
.xrow.off .nm{color:var(--muted);font-weight:500}
.dchips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
.dc{min-height:44px;min-width:44px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem}
.dc.mode{margin-left:auto}.dc.mode~.dc.mode{margin-left:0}
.dc[aria-pressed=true]{background:#FFE14D;border-color:#8a7500;color:#111}
.dc.mode[aria-pressed=true]{background:#dfe6ea;border-color:#555}
.g-custom{background:#D9D9D9}
/* sheet */
.veil{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h2{font-size:1.8rem;line-height:1.05;overflow-wrap:anywhere}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:44px;height:44px;flex:none;font-size:1.2rem}
.hrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
.hrow+.hrow{margin-top:6px}
.hrow span:first-child{min-width:0}
.hrow span:last-child{color:var(--muted);white-space:nowrap;margin-left:auto}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-block:14px;font-variant-numeric:tabular-nums}
.wknav b{font-family:var(--display);font-size:1.4rem}
.wknav .btn{width:56px;font-size:1.3rem}
.wkbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-block:12px}
.wkbtn .btn:first-child{grid-column:1/-1}
.paper{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;overflow-x:auto;margin-top:14px}
.paper table{border-collapse:collapse;font:12px/1.3 var(--body);min-width:620px;width:100%}
.paper td{border:1px solid #333;padding:4px 6px;vertical-align:top}
.paper .pk2{font-size:calc(1em - 2pt);font-weight:600}
.paper .sr{display:grid;grid-template-columns:1.2em 1fr 1fr;gap:6px;height:1.3em;align-items:end}.paper .sr1{grid-template-columns:1.2em 1fr}.paper .sr b{font-weight:600;line-height:1.3}.paper .sr i{border-bottom:1px solid #333;height:1.1em}
.paper td.xday{background:linear-gradient(to top right,transparent calc(50% - .6px),#777,transparent calc(50% + .6px)),linear-gradient(to top left,transparent calc(50% - .6px),#777,transparent calc(50% + .6px)),#d9d9d9}
.g-daily{background:#FFFF00}.g-mwf{background:#FF9933}.g-tt{background:#92D050}.g-twice{background:#FF99FF}.g-once{background:#66FFFF}
@page{size:landscape;margin:.4in}
@media print{
  .nav,.noprint{display:none!important}
  body{background:#fff;padding:0}#app{max-width:none;padding:0}
  .paper{border:0;border-radius:0;overflow:visible;margin:0;break-inside:avoid;height:99vh;display:flex;flex-direction:column;justify-content:center}
  .paper+.paper{break-before:page}
  /* one sheet = one landscape page: 14 equal rows under a short heading, same cell size on every page */
  .paper table{min-width:0;width:100%;table-layout:fixed;font-size:12px;line-height:1.25}
  .paper td{vertical-align:top;padding:4px 7px;overflow:hidden;overflow-wrap:anywhere}
  .paper thead tr{height:.32in}
  .paper tbody tr{height:var(--rh,.49in)}
  .paper td:nth-child(1){width:30%}
  .paper td:nth-child(n+2){width:14%}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.today{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.today .big{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.today .last{color:var(--muted);font-size:.9rem;margin-top:2px}
.trow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.tmain{flex:1;min-width:0}
.mveil{z-index:30;align-items:center;padding:20px}
.mveil .dsheet{border-radius:16px;max-width:480px;max-height:92%}
.eph{display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px;margin-bottom:6px}
.eph h3{margin:0}
.dd{min-height:38px;padding:6px 12px;font-size:.85rem}
.mbox .tg{margin-bottom:14px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:340px;width:100%;text-align:center}
.mbox p{margin:0 0 16px;font-size:1.05rem;font-weight:600}
.sets{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.set{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);background:transparent;font-family:var(--display);font-weight:700;font-size:1.5rem}
.set[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.plan{margin-top:18px}
.plan h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;min-height:40px;font-weight:600}
.tg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tg button.sel{outline:2px solid var(--accent);outline-offset:2px}
.tg button.ov::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{grid-template-columns:.9fr .9fr .9fr 1.5fr}
.grid2c{grid-template-columns:1fr 1fr}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{width:100%}
.hint{color:var(--muted);font-size:.85rem;margin-top:8px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px}
.chk input{width:22px;height:22px}
textarea{width:100%;min-height:90px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font:.8rem/1.3 ui-monospace,monospace}
.link{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted)}
</style>

</head>
<body>
<div id="app"></div>

<script>
(function(){
/* ---------- default exercises from the spreadsheet ---------- */
var RAW = [
 // [name, sets, reps, weighted, frequency]
 ['Nustep',1,'10 min',0,'daily'],['Arm Bike',1,'10 min',0,'daily'],['Treadmill',1,'10 min',0,'daily'],
 ['PT Exercises & Flexibility',1,'10 min',0,'daily'],['Med-X Super Stretch',1,'Optional',0,'daily'],
 ['Theraband Bilateral Flexion',3,'8-10',0,'daily'],['Theraband Horizontal Abduction',3,'8-10',0,'daily'],
 ['Theraband Bilateral External Rotation',3,'8-10',0,'daily'],['Vibratherapy',1,'Optional',0,'daily'],
 ['Box Lift and Carry',3,'Changes',1,'daily'],['Sled Push / Pull',3,'Changes',1,'daily'],
 ['Planks',3,'30 sec',0,'daily'],['Star Excursion Drill',3,'8-10',0,'daily'],['Screw Transfer',3,'8-10',1,'twice'],
 ['mwf','Bucket Pull Vertical|Bucket Pull Horizontal|Ladder Climbs|Squatting Variation|Farmers Carry|Lat Pulldowns|Seated Rows|Barbell Push-Ups|Tricep Pushdowns|Wall Sits|Stair Climbing Intervals|Easy Bar Curls|I\u2019s, Y\u2019s & T\u2019s'],
 ['tt','One Arm Rows|Med-X Core Isolator|Champagne Press|Lateral Band Walks|Leg Extensions|Hamstring Curls|Clam Shells|Reverse Pulldowns|Calf Raises|Sledgehammer & Tire|Retro Band Walks'],
 ['twice','PVC Pipe Walk Ups|Concrete Bag Transfer|Med-X Lumbar Machine|Pallet Step-Ups|Twist Crunches|Bicep Curls|Hammer Curls|Med-X Torso Rotation|Ab Wheel|Dumbbell Incline Bench|Dumbbell Shoulder Press|Lunges|Kettlebell Swings|Suitcase Carry|Flutter Kicks & Crossovers|Tib Bar|Hexagon Drill|Inverted Barbell Rows (Pronated and Supinated)|Bird Dogs|Forearm Roller'],
 ['once','Deadlift|Barbell Incline Press|Barbell Shoulder Press|Barbell Bent Over Rows|Barbell Back or Front Squats|Unilateral Sit To Stand Squats|Nordic Hamstring Curls|Turkish Get Ups|Plyometric Variations|Dumbbell Cleans and/or Snatches|Skull Crushers|Neutral Grip Incline Bench|Neutral Grip Shoulder Press']
];
var WEIGHTED = /barbell|dumbbell|curl|press|row|pulldown|pushdown|deadlift|squat|kettlebell|carry|extension|calf|skull|sled|farmers|suitcase|lunge|bench|clean|snatch|bag|hammer|dips|get ups|lift/i;
var NOTW = /band|wall sit|plank|hamstring curls\b.*nordic|nordic|clam|bird|flutter|crunch|ab wheel|push-ups|walk/i;
var FREQ = {daily:'Every day (Mon–Fri)',mwf:'Mon · Wed · Fri',tt:'Tue · Thu',twice:'2× a week, my days',once:'1× a week, my day',off:'Off'};
var LEGACY={daily:[1,2,3,4,5],mwf:[1,3,5],tt:[2,4]};
var DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function defaults(){
  var out=[],n=0;
  RAW.forEach(function(r){
    if(r.length===2){
      r[1].split('|').forEach(function(nm){
        var w = WEIGHTED.test(nm) && !NOTW.test(nm) ? 1 : 0;
        out.push({id:'e'+(n++),name:nm,freq:r[0],plan:{sets:3,reps:'8-10',weight:'',weighted:w,timed:0},ov:{}});
      });
    } else out.push({id:'e'+(n++),name:r[0],freq:r[4],plan:{sets:r[1],reps:r[2],weight:'',weighted:r[3],timed:/min|sec/i.test(r[2])?1:0,tunit:/sec/i.test(r[2])?'sec':/min/i.test(r[2])?'min':''},ov:{}});
  });
  out.forEach(function(e,i){e.pg=Math.floor((i>=58?i+1:i)/14)});
  return out;
}

/* ---------- storage (falls back to memory if blocked) ---------- */
var BASEKEY='workoutlog.v1', BASEPKEY='workoutlog.photos.v1', PEOPLEKEY='workoutlog.people.v1';
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
/* people: the first person (p0) keeps the original storage keys, so nothing saved before this update is lost.
   Everyone else gets their own keys, so each person has a separate exercise list and history. */
function keyFor(id,base){return id==='p0'?base:base+'.'+id}
var PPL = load(PEOPLEKEY);
if(!PPL||!Array.isArray(PPL.list)||!PPL.list.length)PPL={cur:'p0',n:1,list:[{id:'p0',name:''}]};
if(!PPL.list.some(function(p){return p.id===PPL.cur}))PPL.cur=PPL.list[0].id;
var KEY=keyFor(PPL.cur,BASEKEY), PKEY=keyFor(PPL.cur,BASEPKEY);
var S = load(KEY) || {ex:defaults(),log:{},next:1000};
S.admin=1;   // the admin lock is removed: everything can always be changed
var PH = load(PKEY) || {};
(function(){ var p=PPL.list.filter(function(x){return x.id===PPL.cur})[0]; if(p&&!p.name){p.name=(PPL.cur==='p0'&&S.name)?S.name:'Me'; save(PEOPLEKEY,PPL)} })();
(function(){ if(S.mig2)return; var d={};defaults().forEach(function(e){d[e.name.toLowerCase()]=e.freq});
  S.ex.forEach(function(e){ if(e.freq==='off'&&d[e.name.toLowerCase()])e.freq=d[e.name.toLowerCase()] }); S.mig2=1; save(KEY,S); })();
(function(){ if(S.mig3)return;
  S.ex.forEach(function(e,i){if(e.pg==null&&/^e\d+$/.test(e.id)&&+e.id.slice(1)<1000)e.pg=Math.floor(i/14)});
  var gone=S.ex.filter(function(e){return e.name==='Dips'});
  gone.forEach(function(g){Object.keys(S.log).forEach(function(k){if(S.log[k][g.id]){delete S.log[k][g.id];if(!Object.keys(S.log[k]).length)delete S.log[k]}})});
  S.ex=S.ex.filter(function(e){return e.name!=='Dips'}); S.mig3=1; save(KEY,S); })();
(function(){ if(S.mig5)return; var d={};defaults().forEach(function(e){d[e.name.toLowerCase()]=e.freq});
  S.ex.forEach(function(e){var df=d[e.name.toLowerCase()];
    if(e.freq==='daily'&&!e.days&&(df==='mwf'||df==='tt'))e.freq=df;

function amountText(p){if(p.ps&&p.ptime&&!psItemsRaw(p).some(function(x){return x}))return '';if(p.ps)return psItems(p,true).join(p.ptime?' / ':' ');if(p.setsonly)return p.sets+(+p.sets===1?' set':' sets');var a=amountOne(p.sets,p.reps,p.weight,p.weighted,p.shelf?shTxt(p,p.shelves):'',p.hammer,p.trips,p.noreps);for(var rk=2,rn=nrows(p);rk<=rn;rk++){if(+p['sets'+rk]>0)a+=' + '+amountOne(p['sets'+rk],p['reps'+rk],p['weight'+rk],p.weighted,p.shelf?shTxt(p,p['shelves'+rk]):'',p.hammer,p.trips,p.noreps)}return a+bandTxt(p)+laddTxt(p)+gripTxt(p)+chTxt(p)}

  var en=entry(k,e.id),sn=en.snap||planFor(e,fromKey(k).getDay(),k);
  return (n>=total(sn)?'✓ ':n+'/'+total(sn)+' ')+amountText(sn);
}
function weekModel(mon){
  var dates=weekOf(fromKey(mon));
  var did=function(e){return dates.some(function(k){return checked(k,e.id)>0})};
  var list=S.ex.filter(function(e){return e.freq!=='off'||did(e)});
  var pgOf=function(e){return e.pg!=null?e.pg:Math.floor(S.ex.indexOf(e)/14)};
  var ord=list.map(function(e){return {e:e,pg:pgOf(e),i:S.ex.indexOf(e)}}).sort(function(a,b){return a.pg-b.pg||a.i-b.i}).map(function(o){return o.e});
  var all=ord.map(function(e){
    var g=e.freq==='off'?'':e.freq;
    var r={name:e.name,group:g,amount:amountText(weekAll(e,dates[0])),
      sched:dates.map(function(k){return scheduled(e,fromKey(k).getDay(),k)}),
      skip:dates.map(function(k){return e.freq!=='off'&&!isFlex(e)&&!scheduled(e,fromKey(k).getDay(),k)&&!cellText(e,k)}),
      cells:dates.map(function(k){return cellText(e,k)}),
      plan:dates.map(function(k){var dw=fromKey(k).getDay();if(e.freq==='off'||(!isFlex(e)&&!scheduled(e,dw,k)))return '';return amountText(planFor(e,dw,k))}),
      blank:dates.map(function(k){var dw=fromKey(k).getDay();if(e.freq==='off'||(!isFlex(e)&&!scheduled(e,dw,k)))return 0;return blankSets(planFor(e,dw,k))})};
    var ln=Math.ceil(r.name.length/42)+(g==='twice'?1:0);
    r.cells.forEach(function(t,j){var tx=t||r.plan[j]||'',n=Math.ceil(tx.length/17);if(!t&&r.blank[j])n=Math.max(1,r.blank[j].n);if(n>ln)ln=n});
    r.cost=Math.max(1,(0.083+0.156*Math.max(1,ln))/0.49);
    return r;
  });
  var sheets=[],pageNums=[],m=all.length;
  if(m){
    var tot=all.reduce(function(a,r){return a+r.cost},0),CAP=14.2;
    var pre=[0];all.forEach(function(r,q){pre.push(pre[q]+r.cost)});
    var part=function(np){
      var INF=1e9,best=[],from=[],k,q,p;
      for(k=0;k<=np;k++){best.push([]);from.push([]);for(q=0;q<=m;q++){best[k].push(INF);from[k].push(0)}}
      best[0][0]=0;
      for(k=1;k<=np;k++)for(q=k;q<=m;q++)for(p=k-1;p<q;p++){
        var c=Math.max(best[k-1][p],pre[q]-pre[p]);
        if(c<best[k][q]-1e-9){best[k][q]=c;from[k][q]=p}
      }
      var cuts=[],qq=m;for(k=np;k>=1;k--){cuts.unshift(from[k][qq]);qq=from[k][qq]}
      return {max:best[np][m],cuts:cuts};
    };
    var np=Math.min(m,Math.max(4,Math.min(6,Math.ceil(tot/14)))),res=part(np);
    while(res.max>CAP&&np<m){np++;res=part(np)}
    var starts=res.cuts.concat([m]);
    for(var pi=0;pi<np;pi++){
      var rows=all.slice(starts[pi],starts[pi+1]);if(!rows.length)continue;
      var psum=rows.reduce(function(a,r){return a+r.cost},0);
      rows.forEach(function(r){r.rh=(r.cost/psum).toFixed(4)});
      sheets.push(rows);pageNums.push(pi+1);
    }
  }
  return {dates:dates,sheets:sheets,pageNums:pageNums,any:list.some(function(e){return dates.some(function(k){return checked(k,e.id)>0})})};
}

          var nm=String(x.name).trim(),hit=PPL.list.filter(function(p){return p.name.toLowerCase()===nm.toLowerCase()})[0],id;
          if(hit)id=hit.id;else{id=newPersonId();PPL.list.push({id:id,name:nm})}
          var d=x.data;d.admin=adm2;d.next=d.next||1000;save(keyFor(id,BASEKEY),d);
        });
        savePeople();return location.reload();
      }
      if(!o||!Array.isArray(o.ex)||typeof o.log!=='object')throw 0;
      var wasAdm=S.admin;S=o;S.admin=wasAdm;S.next=S.next||1000;persist();U.showBackup=false;render();
    }catch(x){msg.textContent='That text is not a valid backup.'}
  }
});
app.addEventListener('change',function(ev){
  var t=ev.target,a=t.getAttribute('data-a');
  if(t.id==='wkname'){S.name=t.value.trim();persist();return render()}
  if(t.id==='flt'){U.filter=t.value;return render()}
  if(!S.admin){if(a==='pf'){var pe0=byId(U.open);if(!pe0||!pe0.plan.ps)return;U.scope='week';U.target=String(fromKey(U.date).getDay())}else if(a==='freq'||a==='ut'||a==='uw')return}
  if(a==='freq'){var fe=byId(t.getAttribute('data-v'));fe.freq=t.value;fe.days=(LEGACY[t.value]||[]).slice();persist();keepSheet();return render()}
  if(a==='ut'){byId(U.open).plan.timed=t.checked?1:0;persist();keepSheet();return render()}
  if(a==='uw'){byId(U.open).plan.weighted=t.checked?1:0;persist();keepSheet();return render()}
  if(a==='pf'){
    keepSheet();
    var e=byId(U.open),f=t.getAttribute('data-v'),val=/^sets\d?$/.test(f)?+t.value:t.value;
    if(U.scope==='week'){
      var wkKey=weekOf(fromKey(U.date)),tk=U.target;e.wk=e.wk||{};var wo=e.wk[wkKey[0]]=e.wk[wkKey[0]]||{};
      if(!wo[tk]){var cw=tk==='all'?weekAll(e,wkKey[0]):planFor(e,+tk,wkKey[+tk-1]);wo[tk]={sets:cw.sets,reps:cw.reps,weight:cw.weight,sets2:cw.sets2,reps2:cw.reps2,weight2:cw.weight2,shelves:cw.shelves,shelves2:cw.shelves2,band:cw.band,ladder:cw.ladder,jacket:cw.jacket,ch:cw.ch,reps3:cw.reps3,weight3:cw.weight3,sets3:cw.sets3,shelves3:cw.shelves3,sets4:cw.sets4,reps4:cw.reps4,weight4:cw.weight4,shelves4:cw.shelves4}}
      wo[tk][f]=val;
    }
    else if(U.target==='all')e.plan[f]=val;
    else{e.ov[U.target]=e.ov[U.target]||{};
      if(!e.ov[U.target].hasOwnProperty('sets')){var cur=planFor(e,+U.target);e.ov[U.target]={sets:cur.sets,reps:cur.reps,weight:cur.weight,sets2:cur.sets2,reps2:cur.reps2,weight2:cur.weight2,shelves:cur.shelves,shelves2:cur.shelves2,band:cur.band,ladder:cur.ladder,jacket:cur.jacket,ch:cur.ch,reps3:cur.reps3,weight3:cur.weight3,sets3:cur.sets3,shelves3:cur.shelves3,sets4:cur.sets4,reps4:cur.reps4,weight4:cur.weight4,shelves4:cur.shelves4}}
      e.ov[U.target][f]=val}
    persist();render();
  }
});
app.addEventListener('input',function(ev){
  if(ev.target.id==='q'){U.q=ev.target.value;var pos=ev.target.selectionStart;render();var i=document.getElementById('q');i.focus();i.setSelectionRange(pos,pos)}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.id==='admcode'){var gb=document.querySelector('[data-a=admgo]');if(gb)gb.click();return}
  if(ev.key==='Escape'&&(U.dayPick||U.dayEdit||U.rowsPick)){U.dayPick=false;U.dayEdit=null;U.rowsPick=false;render();return}
  if(ev.key==='Escape'&&U.open){U.open=null;render()}
});
render();
})();
